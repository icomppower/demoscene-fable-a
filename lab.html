<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style><canvas id=c></canvas>
<script>
const Q=new URLSearchParams(location.hash.slice(1)),P=k=>+Q.get(k)||0;
const c=document.getElementById('c'),g=c.getContext('webgl2');c.width=1280;c.height=720;
const FS=`#version 300 es
precision highp float;
uniform vec2 R;uniform float T,F,A1,A2,A3,A4,A5,A6,YW,CZ;out vec4 O;
#define rot(a) mat2(cos(a),-sin(a),sin(a),cos(a))
vec3 pal(float t,vec3 d){return .5+.5*cos(6.2832*(t+d));}
float tr;
float box(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float map(vec3 p){
 tr=9.;
 if(F<.5){ // apollonian with carved tube
  p.x+=sin(p.z*.2)*1.5;
  float sc=A2>0.?A2:.6;vec3 q=p*sc;float s=sc;
  for(int i=0;i<8;i++){q=-1.+2.*fract(.5*q+.5);float r2=dot(q,q);float k=(A1>0.?A1:1.1)/r2;q*=k;s*=k;tr=min(tr,r2);}
  float d=.25*abs(q.y)/s;
  return max(d,(A5>0.?A5:.8)-length(p.xy));
 }
 if(F<1.5){ // polar-fold KIFS tunnel
  p.xy*=rot(p.z*A4);
  float a=atan(p.y,p.x),r=length(p.xy),n=A6>0.?A6:6.;a=mod(a+3.14159/n,6.28318/n)-3.14159/n;p.xy=vec2(cos(a),sin(a))*r;
  p.x-=A5>0.?A5:3.;p.z=mod(p.z,3.)-1.5;
  float s=1.;vec3 q=p;
  for(int i=0;i<6;i++){q=abs(q);if(q.x<q.y)q.xy=q.yx;if(q.x<q.z)q.xz=q.zx;q.xy*=rot(A1);q.yz*=rot(A2);q=q*A3-vec3(A3-1.);tr=min(tr,length(q));s*=A3;}
  return (box(q,vec3(1.))-.0)/s;
 }
 if(F<2.5){ // menger sponge interior, scaled
  p.x+=sin(p.z*.15)*1.;
  vec3 pp=p/4.;float d=-1e9,s=1.;
  for(int i=0;i<4;i++){vec3 a=mod(pp*s,2.)-1.;s*=3.;vec3 r=abs(1.-3.*abs(a));float da=max(r.x,r.y),db=max(r.y,r.z),dc=max(r.z,r.x);float c=(min(da,min(db,dc))-1.)/s;d=max(d,c);tr=min(tr,c*s);}
  return d*4.;
 }
 // sierpinski-ish KIFS with tube
 p.x+=sin(p.z*.2)*1.5;
 vec3 q=p;q.z=mod(q.z,4.)-2.;float s=1.;
 for(int i=0;i<9;i++){q=abs(q);if(q.x+q.y<0.)q.xy=-q.yx;if(q.x+q.z<0.)q.xz=-q.zx;if(q.y+q.z<0.)q.yz=-q.zy;q.xy*=rot(A1);q.xz*=rot(A2);q=q*2.-vec3(A3>0.?A3:1.);s*=2.;tr=min(tr,length(q));}
 float d=(length(q)-1.)/s;
 return max(d,.8-length(p.xy));
}
vec3 nrm(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<5;i++){float h=.04*float(i);o+=s*(h-map(p+n*h));s*=.6;}return clamp(1.-3.*o,0.,1.);}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
 vec3 ro=vec3(F<1.5&&F>.5?0.:-sin(CZ*.2)*1.5,0,CZ),ta=vec3(F<1.5&&F>.5?0.:-sin((CZ+2.)*.2)*1.5,0,CZ+2.);
 if(F>1.5&&F<2.5){ro=vec3(4.-sin(CZ*.15),4.,CZ);ta=vec3(4.-sin((CZ+2.)*.15),4.,CZ+2.);}
 ta.x+=YW;vec3 f=normalize(ta-ro),r=normalize(cross(f,vec3(0,1,0))),u=cross(r,f);
 vec3 rd=normalize(f*1.4+uv.x*r+uv.y*u);
 float d=0.,h,gl=0.;
 for(int i=0;i<150;i++){h=map(ro+rd*d);if(h<.0005*d||d>40.)break;d+=h*.7;gl+=exp(-h*30.)*.015;}
 vec3 p=ro+rd*d,n=nrm(p);float t2=tr;
 vec3 lp=ro+vec3(0,1,-1),ld=normalize(lp-p);
 float dif=max(dot(n,ld),0.),spe=pow(max(dot(reflect(rd,n),ld),0.),32.),a=ao(p,n),fr=pow(1.-max(dot(-rd,n),0.),3.);
 vec3 cc=pal(t2*.4,vec3(0,.33,.67));
 vec3 col=cc*(dif*.7+.3)*a+spe*.6+fr*.3;
 float fog=1.-exp(-d*d*.005);
 col=mix(col,vec3(.03,.02,.06),fog);col+=cc*gl*.6;
 col=1.-exp(-col*1.4);
 O=vec4(pow(col,vec3(.9)),1);
}`;
const V=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const p=g.createProgram();for(const[t,s]of[[g.VERTEX_SHADER,V],[g.FRAGMENT_SHADER,FS]]){const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))throw g.getShaderInfoLog(o);g.attachShader(p,o);}g.linkProgram(p);g.useProgram(p);
g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);g.enableVertexAttribArray(0);g.vertexAttribPointer(0,2,g.FLOAT,false,0,0);
g.viewport(0,0,1280,720);g.uniform2f(g.getUniformLocation(p,'R'),1280,720);
for(const k of['F','A1','A2','A3','A4','A5','A6','YW','CZ'])g.uniform1f(g.getUniformLocation(p,k),P(k));
g.drawArrays(g.TRIANGLES,0,3);
</script>
