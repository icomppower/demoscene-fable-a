  for(let i=0;i<NS;i++){
   const t=i/SR,bar=t/BAR,bt=(t/SPB)%1;
   const kOn=(bar>=8&&bar<24)||(bar>=28&&bar<40);
   const sc=kOn?1-.55*Math.exp(-bt*SPB*9):1;
   let w=W[i];
   // ping-pong delay (lead/arps share it)
   const dv=DO[di];DL[di]=w*.5+dv*.45;di=(di+1)%d1;
   w+=dv*.35;
   // reverb
   let rv=0,x=w*.6;
   for(let k=0;k<4;k++){const b=cb[k],n=b.length,j=i%n;const y=b[j];cf[k]+=(y-cf[k])*.35;rv+=y;b[j]=x+cf[k]*.83;}
   rv*=.25;
   for(let k=0;k<2;k++){const b=ab[k],n=b.length,j=i%n;const y=b[j];b[j]=rv+y*.5;rv=y-rv*.5;}
   const v=K[i]+sc*(D[i]+w+rv*.5);
   O[i]=Math.tanh(v*1.1);
  }
 }
 return out;
}
let buf=null;
function render(){compose();const o=fx();buf=ac.createBuffer(2,NS,SR);buf.copyToChannel(o[0],0);buf.copyToChannel(o[1],1);}
// ---------- timeline ----------
const CAP=[[1,3.5,'in the beginning, there was noise'],[4.5,8,'FABLE',1],[9,11.5,'then, a pattern'],[17,19.5,'patterns of patterns'],[25,27.5,'and something that watched'],[30,32.5,'and it told itself a story'],[40.5,43,'a fable, told by itself'],[43.5,45.5,'claude fable 5.1 · 2026']];
const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);};
function frame(t){
 const bar=t/BAR,bt=(t/SPB)%1,bi=Math.floor(t/SPB);
 const kOn=(bar>=8&&bar<24)||(bar>=28&&bar<40);
 const B=kOn?Math.exp(-bt*SPB*7):0;
 let S=0,C=[0,0,0],L=[0,0,1],K=[.2,.8,1],X1=1,X2=0,X3=0,X4=0,X5=0,G=1,A=.5;
 const path=z=>[Math.sin(z*.2)*1.5,0,z];
 if(bar<8){S=0;X1=sm(0,3,bar)*(1-.5*sm(7,8,bar));A=.3;}
 else if(bar<16){S=1;const z=t*1.6;C=[1+.45*Math.sin(t*.5),1+.45*Math.cos(t*.37),z];L=[1+.6*Math.sin(t*.5+1),1+.4*Math.cos(t*.37+1),z+3];X4=Math.sin(t*.2)*.4;G=1.2;A=.4;}
 else if(bar<24){S=2;const z=(t-16*BAR)*1.5;C=path(z);C[0]+=Math.sin(t*.7)*.3;C[1]=Math.sin(t*.5)*.25;L=path(z+2);L[0]+=Math.sin(t*.31)*1.5;L[1]=Math.cos(t*.27)*.8;X1=1.1+.06*Math.sin(t*.2);X4=Math.sin(t*.25)*.15;G=.7;A=.5;}
 else if(bar<28){S=3;const a=(bar-24)*.45+.3,r=3.8-(bar-24)*.2;C=[Math.sin(a)*r,.6-.25*(bar-24),Math.cos(a)*r];L=[0,0,0];X1=.16+.03*Math.sin(t*.8)+sm(26,28,bar)*.15;X4=Math.sin(t*.3)*.04;G=1;A=.3+sm(26,28,bar)*1.5;}
 else if(bar<40){
  const seg=bar<32?0:bar<34?1:bar<36?0:bar<37?2:bar<38?1:0;
  const sp=1+sm(38,40,bar)*.8;
  if(seg==0){S=4;const z=(t-28*BAR)*3.5*sp+Math.floor(bar/4)*7;C=path(z);C[1]=Math.sin(t*.9)*.3;C[0]+=Math.cos(t*.7)*.3;L=path(z+2.5);L[1]+=Math.sin(t*.6)*.4;X1=t*.5;X3=t*.25;X4=t*.35+(bi&1?1:-1)*B*.08;K=bar<32?[.2,.8,1]:bar<36?[1,.35,.75]:[1,.75,.3];G=.6+B*.4;A=.6+B;}
  else if(seg==1){S=1;const z=t*4.5;C=[1+.45*Math.sin(t*.9),1+.45*Math.cos(t*.7),z];L=[1+.6*Math.sin(t*.9+1),1+.4*Math.cos(t*.7+1),z+3];X4=t*.6+(bi&1?1:-1)*B*.1;G=1.2;A=.5+B;}
  else{S=2;const z=(t-36*BAR)*4;C=path(z);C[1]=Math.sin(t*.5)*.25;L=path(z+2);L[0]+=Math.sin(t*.9)*1.5;L[1]=Math.cos(t*.8)*.8;X1=1.1;X4=t*.5;G=.7;A=.5+B;}
 }
 else{S=5;X1=sm(46,40,bar)*.9;A=.3;}
 // cuts flash
 let Z=0;for(const cb of[8,16,24,28,32,34,36,37,38])Z+=Math.exp(-Math.max(0,bar-cb)*BAR*6)*(bar>=cb?1:0)*.6;
 if(bar>=28&&bar<40)Z+=B*.05;
 const F=sm(0,1,bar)*(1-sm(45,46,bar));
 // text
 let TA=0,TY=-.3,TS=.7,txt='';
 for(const[a,z,s,big]of CAP)if(bar>=a-1&&bar<z+1){txt=s;TA=sm(a-1,a,bar)*(1-sm(z,z+1,bar));if(big){TY=0;TS=.8;}}
 if(txt)setText(txt,txt=='FABLE');
 // draw scene
 g.bindFramebuffer(g.FRAMEBUFFER,fb);g.viewport(0,0,W2,H2);g.useProgram(P1);
 g.uniform2f(U(P1,'R'),W2,H2);g.uniform1f(U(P1,'T'),t);g.uniform1f(U(P1,'B'),B);g.uniform1f(U(P1,'S'),S);
 g.uniform1f(U(P1,'X1'),X1);g.uniform1f(U(P1,'X2'),X2);g.uniform1f(U(P1,'X3'),X3);g.uniform1f(U(P1,'X4'),X4);g.uniform1f(U(P1,'X5'),X5);
 g.uniform3fv(U(P1,'C'),C);g.uniform3fv(U(P1,'K'),K);g.uniform3fv(U(P1,'L'),L);
 g.drawArrays(g.TRIANGLES,0,3);
 g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,ft);g.generateMipmap(g.TEXTURE_2D);g.activeTexture(g.TEXTURE1);g.bindTexture(g.TEXTURE_2D,tt);
 g.bindFramebuffer(g.FRAMEBUFFER,null);g.viewport(0,0,W,H);g.useProgram(P2);
 g.uniform2f(U(P2,'R'),W,H);g.uniform1f(U(P2,'T'),t);g.uniform1f(U(P2,'G'),G);g.uniform1f(U(P2,'A'),A);g.uniform1f(U(P2,'F'),F);g.uniform1f(U(P2,'Z'),Math.min(1,Z));
 g.uniform1i(U(P2,'X'),0);g.uniform1i(U(P2,'Y'),1);g.uniform1f(U(P2,'TA'),TA);g.uniform1f(U(P2,'TY'),TY);g.uniform1f(U(P2,'TS'),TS);g.drawArrays(g.TRIANGLES,0,3);
}
// ---------- start ----------
const o=document.getElementById('o');
let st=-1,want=0;
function start(){if(st>=0)return;if(!buf){want=1;return;}o.style.display='none';ac.resume();const s=ac.createBufferSource();s.buffer=buf;if(!Q.get('mute'))s.connect(ac.destination);s.start(0,T0);st=ac.currentTime-T0;
 (function loop(){const t=ac.currentTime-st;if(t<DUR+1){frame(t);requestAnimationFrame(loop);}})();}
setTimeout(()=>{render();o.textContent='CLICK TO START';onclick=start;onkeydown=e=>{if(e.key==' ')start();};if(want)start();},30);
